log_format ba_raw '$remote_addr [$time_local] "$request" $status bytes=$body_bytes_sent '
                  'ct="$content_type" clen="$content_length" reqlen="$request_length" '
                  'host="$host" ua="$http_user_agent" ref="$http_referer" '
                  'rct="$http_content_type" acc="$http_accept" ae="$http_accept_encoding" xff="$http_x_forwarded_for"';
